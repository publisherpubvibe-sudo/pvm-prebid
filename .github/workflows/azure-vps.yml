name: Temporary Windows RDP VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP & Configure Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # User Password Set
          $AdminUser = [adsi]"WinNT://./runneradmin,user"
          $AdminUser.SetPassword("P@ssword12345")
          $AdminUser.SetInfo()

      - name: Start Pinggy RDP Tunnel
        shell: powershell
        run: |
          # SSH client check & start tunnel
          Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 qr@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -NoNewWindow
          Start-Sleep -Seconds 8
          
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "RDP connection setup complete!" -ForegroundColor Green
          Write-Host "Username : runneradmin" -ForegroundColor Yellow
          Write-Host "Password : P@ssword12345" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          Get-Content pinggy.log | Select-String "tcp://"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
