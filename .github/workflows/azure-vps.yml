name: Temporary Windows RDP VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP & Configure Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Admin password set
          $AdminUser = [adsi]"WinNT://./runneradmin,user"
          $AdminUser.SetPassword("P@ssword12345")
          $AdminUser.SetInfo()

      - name: Download & Start Cloudflare Tunnel
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -RedirectStandardOutput "cloudflared.log" -RedirectStandardError "cloudflared.err" -NoNewWindow
          
          Start-Sleep -Seconds 10
          
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "RDP Setup Complete via Cloudflare!" -ForegroundColor Green
          Write-Host "Username : runneradmin" -ForegroundColor Yellow
          Write-Host "Password : P@ssword12345" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green
          
          Get-Content cloudflared.err | Select-String "trycloudflare.com"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
