name: Temporary Windows RDP VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP & Set User Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin MySecretPass123! /add
          net localgroup administrators runneradmin /add

      - name: Download & Setup Ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/b4PvuBzR0eY/ngrok-v1.1.1-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "."
          .\ngrok.exe authtoken $env:NGROK_AUTH_TOKEN
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389"

      - name: Display RDP Connection Details
        run: |
          Start-Sleep -Seconds 5
          $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
          $rdp_url = $response.tunnels[0].public_url.Replace("tcp://", "")
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "RDP Address  : $rdp_url" -ForegroundColor Yellow
          Write-Host "Username     : runneradmin" -ForegroundColor Yellow
          Write-Host "Password     : MySecretPass123!" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Green

      - name: Keep Runner Alive
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
