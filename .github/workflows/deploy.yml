name: Deploy PubVibe Stack to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ============================================================
  #  JOB 1 – Build & push Docker images to GitHub Container Registry
  # ============================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build backend ────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pubvibe-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build admin panel ────────────────────────────────────
      - name: Build & push admin-panel
        uses: docker/build-push-action@v5
        with:
          context: ./admin-panel
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pubvibe-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build publisher dashboard ────────────────────────────
      - name: Build & push publisher-dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./publisher-dashboard
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pubvibe-publisher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build prebid server ──────────────────────────────────
      - name: Build & push prebid-server
        uses: docker/build-push-action@v5
        with:
          context: ./prebid-server
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/pubvibe-prebid-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  #  JOB 2 – Deploy to EC2 via SSH
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose + nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: "/home/${{ secrets.EC2_USER }}/pubvibe"
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/pubvibe

            # Write .env from GitHub Secrets
            cat > .env <<EOF
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            GHCR_PREFIX=ghcr.io/${{ github.repository_owner }}
            EOF

            # Login to GHCR on EC2
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            # Pull latest images & restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Seed superadmin (safe – skips if already exists)
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T backend \
              node src/services/seedAdmin.js || true

            echo "✅ Deployment complete"
