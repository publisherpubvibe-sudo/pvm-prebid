worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Rate limit zones ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── Upstream definitions ─────────────────────────────────
    upstream backend_api {
        server backend:4000;
        keepalive 16;
    }

    upstream admin_app {
        server admin-panel:80;
    }

    upstream publisher_app {
        server publisher-dash:80;
    }

    # ============================================================
    #  HTTP → HTTPS redirect (uncomment when SSL certs are ready)
    # ============================================================
    # server {
    #     listen 80;
    #     server_name admin.pubvibe.com pub.pubvibe.com;
    #     return 301 https://$host$request_uri;
    # }

    # ============================================================
    #  Admin Panel  →  admin.pubvibe.com  (or port 80 path /admin)
    # ============================================================
    server {
        listen 80;
        server_name admin.pubvibe.com localhost;

        # API proxy – admin panel calls /api/*
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Auth endpoint – stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend_api/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # React SPA
        location / {
            proxy_pass http://admin_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ============================================================
    #  Publisher Dashboard  →  pub.pubvibe.com  (or port 3001)
    # ============================================================
    server {
        listen 80;
        server_name pub.pubvibe.com;

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://publisher_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ============================================================
    #  HTTPS – Admin Panel  (enable after placing certs)
    # ============================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name admin.pubvibe.com;
    #
    #     ssl_certificate     /etc/nginx/certs/admin.pubvibe.com.crt;
    #     ssl_certificate_key /etc/nginx/certs/admin.pubvibe.com.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /api/ {
    #         proxy_pass http://backend_api/api/;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #     }
    #     location / {
    #         proxy_pass http://admin_app;
    #     }
    # }
}
